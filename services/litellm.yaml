name: litellm
image: ghcr.io/berriai/litellm
version_key: litellm

ports:
  - host_port: 4000
    container_port: 4000

volumes:
  - source: ./configs/litellm/config.yaml
    target: /app/config.yaml

environment:
  - LITELLM_MASTER_KEY
  - LITELLM_DATABASE_URL
  - DATABASE_URL

command:
  - --config
  - /app/config.yaml
  - --port
  - "4000"

depends_on:
  - postgres

health:
  command:
    - CMD-SHELL
    - >-
      python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"

documentation: https://docs.litellm.ai/
