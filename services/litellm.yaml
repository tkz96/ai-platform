name: litellm
image: ghcr.io/berriai/litellm
version_key: litellm

ports:
  - host_port: 4000
    container_port: 4000

volumes:
  - source: ./configs/litellm/config.yaml
    target: /app/config.yaml

environment:
  - LITELLM_MASTER_KEY
  - LITELLM_DATABASE_URL

depends_on:
  - postgres

health:
  endpoint: /health/liveliness

documentation: https://docs.litellm.ai/
