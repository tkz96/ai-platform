name: langfuse
image: ghcr.io/langfuse/langfuse
version_key: langfuse

ports:
  - host_port: 3000
    container_port: 3000

environment:
  - DATABASE_URL
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_SALT
  - SALT
  - ENCRYPTION_KEY
  - NEXTAUTH_SECRET
  - NEXTAUTH_URL
  - LANGFUSE_S3_EVENT_UPLOAD_BUCKET
  - CLICKHOUSE_URL
  - CLICKHOUSE_MIGRATION_URL
  - CLICKHOUSE_CLUSTER_ENABLED
  - CLICKHOUSE_USER
  - CLICKHOUSE_PASSWORD
  - REDIS_HOST
  - REDIS_PORT

depends_on:
  - postgres
  - clickhouse
  - redis

health:
  command:
    - CMD-SHELL
    - >-
      node -e "const os=require('os');fetch('http://'+os.hostname()+':3000/api/public/health').then(r=>process.exit(r.ok?0:1))"

documentation: https://langfuse.com/docs
