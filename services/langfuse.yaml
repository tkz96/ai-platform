name: langfuse
image: ghcr.io/langfuse/langfuse
version_key: langfuse

ports:
  - host_port: 3000
    container_port: 3000

environment:
  - LANGFUSE_SECRET_KEY
  - LANGFUSE_SALT
  - NEXTAUTH_SECRET
  - NEXTAUTH_URL

depends_on:
  - postgres
  - clickhouse
  - redis

health:
  endpoint: /api/public/health

documentation: https://langfuse.com/docs
