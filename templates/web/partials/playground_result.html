<div style="margin-top: 1.25rem; display: flex; flex-direction: column; gap: 1rem;" x-data="{ showRaw: false }">
  
  <!-- Status & Performance Metric Strip -->
  <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.75rem 1rem; flex-wrap: wrap; gap: 0.75rem;">
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      {% if result.success %}
        <span class="badge badge-healthy">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Completion Success</span>
        </span>
      {% else %}
        <span class="badge badge-unhealthy">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Inference Offline / Error</span>
        </span>
      {% endif %}

      <span class="mono tabular-nums" style="font-size: 0.775rem; color: var(--text-secondary);">
        Endpoint: <code style="color: var(--accent-cyan-hover);">{{ result.endpoint }}</code>
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 1rem; font-size: 0.8rem;" class="mono tabular-nums">
      <div>
        <span style="color: var(--text-tertiary);">Latency:</span>
        <span style="font-weight: 700; color: {% if result.latency_ms < 100 %}var(--status-emerald-text){% else %}var(--accent-cyan-hover){% endif %};">
          {{ result.latency_ms }} ms
        </span>
      </div>
      {% if result.tokens %}
      <div>
        <span style="color: var(--text-tertiary);">Tokens:</span>
        <span style="font-weight: 700; color: #ffffff;">{{ result.tokens }}</span>
      </div>
      {% endif %}
    </div>
  </div>

  <!-- Model Response Box -->
  <div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem;">
      <label style="font-size: 0.725rem; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em;">Generated Response</label>
      <button 
        class="btn btn-secondary btn-sm" 
        @click="copyToClipboard(`{{ result.content | replace('`', '\\`') }}`, 'Model response copied!')"
        aria-label="Copy model response text">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Copy Response</span>
      </button>
    </div>
    
    <div class="terminal-box {% if not result.success %}error{% endif %}" style="padding: 1.15rem; font-size: 0.85rem; line-height: 1.6;">{{ result.content }}</div>
  </div>

  <!-- Raw JSON Toggle Accordion -->
  <div>
    <button 
      @click="showRaw = !showRaw" 
      class="btn btn-secondary btn-sm" 
      style="font-size: 0.75rem;">
      <span x-text="showRaw ? 'Hide Raw JSON Payload' : 'Show Raw JSON Payload'"></span>
    </button>

    <div x-show="showRaw" x-transition style="margin-top: 0.5rem;">
      <pre class="terminal-box" style="font-size: 0.75rem; max-height: 250px; overflow-y: auto;">{{ result.raw_response }}</pre>
    </div>
  </div>

</div>
