<div class="modal-backdrop" x-data="{ open: true }" x-show="open" x-transition.opacity>
  <div class="modal-content" style="max-width: 900px;" @click.away="open = false">
    
    <!-- Drawer Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.75rem;">
      <div>
        <h3 style="font-size: 1.1rem; font-weight: 600; color: #ffffff;">📋 Container Logs: {{ service_name }}</h3>
        <p style="font-size: 0.75rem; color: var(--text-muted);">Showing last {{ tail }} log lines (Sanitized)</p>
      </div>

      <button @click="open = false" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>

    <!-- Log Terminal Box -->
    <div class="terminal-box" style="max-height: 60vh; overflow-y: auto; font-size: 0.8rem; line-height: 1.6;">{{ logs }}</div>

    <!-- Drawer Footer -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 0.75rem;">
      <button 
        class="btn btn-secondary"
        hx-get="/api/ui/services/{{ service_name }}/logs?tail=200"
        hx-target="#logs-container"
        hx-swap="innerHTML">
        🔄 Refresh (Tail 200)
      </button>

      <button @click="open = false" class="btn btn-primary">Close</button>
    </div>

  </div>
</div>
