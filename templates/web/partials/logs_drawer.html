<div class="modal-backdrop" x-data="{ open: true }" x-show="open" x-transition.opacity>
  <div class="modal-content" style="max-width: 880px;" @click.away="open = false">
    
    <!-- Drawer Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem;">
      <div>
        <h3 style="font-size: 1.05rem; font-weight: 600; color: #ffffff; display: flex; align-items: center; gap: 0.45rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Container Logs: {{ service_name }}
        </h3>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem;">Showing last <span class="mono tabular-nums">{{ tail }}</span> log lines (Sanitized)</p>
      </div>

      <button @click="open = false" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.2rem;" title="Close drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Log Terminal Box -->
    <div class="terminal-box" style="max-height: 58vh; overflow-y: auto; font-size: 0.775rem;">{{ logs }}</div>

    <!-- Drawer Footer -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; border-top: 1px solid var(--border-subtle); padding-top: 0.75rem;">
      <button 
        class="btn btn-secondary"
        hx-get="/api/ui/services/{{ service_name }}/logs?tail=200"
        hx-target="#logs-container"
        hx-swap="innerHTML">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Refresh (Tail 200)
      </button>

      <button @click="open = false" class="btn btn-primary">Close</button>
    </div>

  </div>
</div>
