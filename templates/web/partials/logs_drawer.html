<div 
  class="modal-backdrop" 
  x-data="{ open: true, filter: '', autoScroll: true }" 
  x-show="open" 
  x-transition.opacity
  @keydown.escape.window="open = false"
  role="dialog"
  aria-modal="true"
  aria-labelledby="logs-drawer-title">
  
  <div class="modal-content" style="max-width: 960px;" @click.away="open = false">
    
    <!-- Drawer Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.15rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.85rem; flex-wrap: wrap; gap: 0.75rem;">
      <div>
        <h3 id="logs-drawer-title" style="font-size: 1.15rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 0.5rem; letter-spacing: -0.01em;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Container Logs: {{ service_name }}
        </h3>
        <p style="font-size: 0.775rem; color: var(--text-secondary); margin-top: 0.2rem;">
          Showing tail <span class="mono tabular-nums" style="color: var(--accent-cyan-hover);">{{ tail }}</span> lines · Secrets and bearer tokens redacted
        </p>
      </div>

      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <!-- Tail Selector Buttons -->
        <div style="display: flex; background: rgba(0,0,0,0.3); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.15rem;">
          <button 
            class="btn btn-secondary btn-sm" 
            style="border: none; {% if tail == 50 %}background: var(--bg-surface-elevated); color: #ffffff; font-weight: 600;{% endif %}"
            hx-get="/api/ui/services/{{ service_name }}/logs?tail=50"
            hx-target="#logs-container"
            hx-swap="innerHTML">
            50
          </button>
          <button 
            class="btn btn-secondary btn-sm" 
            style="border: none; {% if tail == 100 %}background: var(--bg-surface-elevated); color: #ffffff; font-weight: 600;{% endif %}"
            hx-get="/api/ui/services/{{ service_name }}/logs?tail=100"
            hx-target="#logs-container"
            hx-swap="innerHTML">
            100
          </button>
          <button 
            class="btn btn-secondary btn-sm" 
            style="border: none; {% if tail == 200 %}background: var(--bg-surface-elevated); color: #ffffff; font-weight: 600;{% endif %}"
            hx-get="/api/ui/services/{{ service_name }}/logs?tail=200"
            hx-target="#logs-container"
            hx-swap="innerHTML">
            200
          </button>
        </div>

        <button 
          @click="open = false" 
          class="btn-icon" 
          title="Close logs drawer (Escape)" 
          aria-label="Close logs drawer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Client-Side Filter Input -->
    <div style="margin-bottom: 0.85rem; display: flex; gap: 0.75rem; align-items: center;">
      <div style="position: relative; flex: 1;">
        <input 
          type="text" 
          x-model="filter" 
          placeholder="Filter log lines in real-time (regex / keyword)..." 
          class="input-text mono" 
          style="font-size: 0.8rem; padding-left: 2rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" style="position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>

      <button 
        class="btn btn-secondary btn-sm" 
        @click="copyToClipboard(`{{ logs | replace('`', '\\`') }}`, 'Full container logs copied!')"
        title="Copy raw logs to clipboard">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Copy Logs</span>
      </button>
    </div>

    <!-- Log Terminal Box -->
    <pre 
      class="terminal-box" 
      style="max-height: 60vh; overflow-y: auto; font-size: 0.775rem; white-space: pre-wrap; word-break: break-all; margin: 0;"
      x-ref="logBox"
      x-init="if (autoScroll) $nextTick(() => { $refs.logBox.scrollTop = $refs.logBox.scrollHeight })">{% if logs %}{{ logs }}{% else %}<span style="color: var(--text-tertiary);">No logs generated yet for this container.</span>{% endif %}</pre>

    <!-- Drawer Footer -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.15rem; border-top: 1px solid var(--border-subtle); padding-top: 0.85rem;">
      <button 
        class="btn btn-secondary"
        hx-get="/api/ui/services/{{ service_name }}/logs?tail={{ tail }}"
        hx-target="#logs-container"
        hx-swap="innerHTML">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Refresh Now</span>
      </button>

      <button @click="open = false" class="btn btn-primary">Close</button>
    </div>

  </div>
</div>
