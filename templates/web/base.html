<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Platform Control Plane & Inference Cluster Management Dashboard">
  
  <!-- Custom Branded SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230ea5e9'/><path d='M9 22L16 8L23 22H19.5L16 14.5L12.5 22H9Z' fill='%23060911'/></svg>">
  
  <title>{% block title %}AI Platform — Control Plane & Cluster Deck{% endblock %}</title>

  <!-- Core Dashboard Design System Stylesheet -->
  <link rel="stylesheet" href="/static/css/dashboard.css">

  <!-- Local Vendored HTMX, SSE Extension & Alpine.js -->
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/sse.js"></script>
  <script defer src="/static/js/alpine.min.js"></script>


  <script>
    // Global toast notifications handler
    document.addEventListener('alpine:init', () => {
      Alpine.store('toasts', {
        items: [],
        add(message, type = 'info') {
          const id = Date.now();
          this.items.push({ id, message, type });
          setTimeout(() => {
            this.items = this.items.filter(t => t.id !== id);
          }, 3500);
        }
      });
    });

    function copyToClipboard(text, label = 'Copied to clipboard!') {
      navigator.clipboard.writeText(text).then(() => {
        if (window.Alpine) {
          Alpine.store('toasts').add(label, 'success');
        }
      });
    }
  </script>
</head>
<body x-data>

  <!-- Accessibility: Skip Link for Keyboard Users -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Navigation Header -->
  <header role="banner" style="border-bottom: 1px solid var(--border-subtle); background: rgba(6, 9, 17, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 40;">
    <div class="container" style="display: flex; align-items: center; justify-content: space-between; height: 4rem;">
      
      <!-- Brand & Platform Identity -->
      <div style="display: flex; align-items: center; gap: 0.9rem;">
        <div style="width: 2.35rem; height: 2.35rem; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--accent-primary), #10b981); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; color: #060911; font-size: 1.05rem; box-shadow: 0 2px 12px rgba(14, 165, 233, 0.35);">
          AI
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 0.55rem;">
            <h1 style="font-size: 1.05rem; font-weight: 700; color: #ffffff; margin: 0;">AI Platform control plane</h1>
            <span class="badge badge-cyan" style="font-size: 0.65rem; font-weight: 700;">v0.1.0</span>
          </div>
          <p style="font-size: 0.725rem; color: var(--text-secondary); margin: 0;">
            Mac Mini orchestrator · Private subnet <span class="mono tabular-nums" style="color: var(--text-code);">10.42.0.0/24</span>
          </p>
        </div>
      </div>

      <!-- Quick Action Controls & Live Status -->
      <div style="display: flex; align-items: center; gap: 0.65rem;">
        
        <!-- Live Cluster State Indicator -->
        <div class="badge badge-healthy" title="Control plane active on Mac Mini">
          <span class="badge-dot pulse-dot" aria-hidden="true"></span>
          <span>Control plane active</span>
        </div>

        <!-- Platform Audit Button -->
        <button 
          class="btn btn-secondary btn-sm"
          hx-get="/api/setup/audit"
          hx-target="#modal-container"
          hx-swap="innerHTML"
          title="Run full platform diagnostic audit"
          aria-label="Run platform health audit">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Audit</span>
        </button>

        <!-- Global Refresh Trigger Button -->
        <button 
          class="btn btn-secondary btn-sm" 
          onclick="htmx.trigger('body', 'refreshAll'); if(window.Alpine) Alpine.store('toasts').add('Refreshed live cluster metrics', 'info');"
          aria-label="Refresh all live cluster metrics"
          title="Refresh all metrics">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>Refresh</span>
        </button>

      </div>
    </div>
  </header>

  <!-- Main Content Landmark -->
  <main id="main-content" class="container" style="margin-top: 1.85rem;">
    {% block content %}{% endblock %}
  </main>

  <!-- Accessible Footer -->
  <footer role="contentinfo" class="container" style="margin-top: 4.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--text-tertiary); flex-wrap: wrap; gap: 1rem;">
    <div>
      <span>AI Platform &copy; 2026. Control plane: <code class="mono">10.42.0.1</code> | Inference host: <code class="mono">10.42.0.2</code></span>
    </div>
    <div style="display: flex; gap: 1.25rem;">
      <a href="http://localhost:4000" target="_blank" rel="noopener noreferrer" style="color: var(--text-secondary); text-decoration: none;">LiteLLM (:4000)</a>
      <a href="http://localhost:3000" target="_blank" rel="noopener noreferrer" style="color: var(--text-secondary); text-decoration: none;">Langfuse (:3000)</a>
      <a href="http://localhost:8080" target="_blank" rel="noopener noreferrer" style="color: var(--text-secondary); text-decoration: none;">Caddy (:8080)</a>
    </div>
  </footer>

  <!-- Toast Notification Stack -->
  <div class="toast-container" aria-live="polite" aria-atomic="true">
    <template x-for="toast in $store.toasts.items" :key="toast.id">
      <div class="toast" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--status-emerald-text)" stroke-width="2.5" aria-hidden="true" x-show="toast.type === 'success'"><polyline points="20 6 9 17 4 12"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2.5" aria-hidden="true" x-show="toast.type === 'info'"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <!-- Dynamic Modal & Drawer Injectors for HTMX -->
  <div id="modal-container" aria-live="polite"></div>
  <div id="logs-container" aria-live="polite"></div>

</body>
</html>
