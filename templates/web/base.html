<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Platform — Control Plane & Cluster Dashboard{% endblock %}</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- HTMX & Alpine.js -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    /* UI Craft Design Tokens: Graphite Preset + Cyan/Emerald Accent Spine */
    :root {
      --bg-dark: #090d16;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --bg-card: rgba(17, 24, 39, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-card: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(6, 182, 212, 0.35);
      
      --accent-cyan: #06b6d4;
      --accent-cyan-light: #22d3ee;
      --accent-cyan-glow: rgba(6, 182, 212, 0.15);
      
      --status-emerald: #10b981;
      --status-amber: #f59e0b;
      --status-rose: #f43f5e;
      --status-slate: #6b7280;

      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;

      /* UI Craft Radius Scale: Inputs 6px, Cards 10px, Modals 14px */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 40%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.06) 0px, transparent 40%),
        radial-gradient(at 50% 100%, rgba(15, 23, 42, 0.5) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 4rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1340px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Glassmorphism Card (UI Craft standard) */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.3);
      transition: border-color 0.15s ease-out, transform 0.15s ease-out, box-shadow 0.15s ease-out;
    }

    .glass-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 8px 30px 0 rgba(6, 182, 212, 0.08);
    }

    /* Header Navigation */
    header {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    /* UI Craft Tabular Numbers for Data */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Status Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-healthy {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .badge-unhealthy {
      background: rgba(244, 63, 94, 0.12);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.25);
    }

    .badge-warning {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .badge-stopped {
      background: rgba(156, 163, 175, 0.1);
      color: #9ca3af;
      border: 1px solid rgba(156, 163, 175, 0.2);
    }

    /* UI Craft Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.38rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease-out;
      text-decoration: none;
      user-select: none;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #090d16;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-cyan-light);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .btn-danger:hover {
      background: rgba(244, 63, 94, 0.22);
    }

    /* Modal Backdrop & Container */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.82);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-content {
      width: 100%;
      max-width: 820px;
      max-height: 85vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    /* Terminal Window Box */
    .terminal-box {
      background: #030712;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }

    .terminal-box.error {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.25);
    }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body x-data="{ modalOpen: false, logsOpen: false }">

  <!-- Navigation Header -->
  <header>
    <div class="container" style="display: flex; align-items: center; justify-content: space-between; height: 3.75rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 2.2rem; height: 2.2rem; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--accent-cyan), #10b981); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #090d16; font-size: 0.95rem;">
          AI
        </div>
        <div>
          <h1 style="font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; color: #ffffff;">AI Platform Control Plane</h1>
          <p style="font-size: 0.725rem; color: var(--text-muted);">Mac Mini Orchestrator · Private Subnet <span class="mono">10.42.0.0/24</span></p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="badge badge-healthy">
          <svg width="6" height="6" viewBox="0 0 6 6" fill="currentColor"><circle cx="3" cy="3" r="3"/></svg>
          Control Plane Active
        </div>

        <button class="btn btn-secondary" onclick="htmx.trigger('body', 'refreshAll')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="container" style="margin-top: 1.75rem;">
    {% block content %}{% endblock %}
  </main>

  <!-- Dynamic Modal & Drawer Containers -->
  <div id="modal-container"></div>
  <div id="logs-container"></div>

</body>
</html>
