name: xynotech-ai-platform
domain: ai.xynotech.internal
default_model: qwen2.5-coder

inference:
  host: 10.42.0.2
  bind_host: 10.42.0.2
  port: 8080
  health_endpoint: /health
  protocol: http
  service_user: ubuntu
  working_directory: /home/ubuntu
  binary_path: /usr/local/bin/llama-server
  model_path: /home/ubuntu/AI/Models/GGUF/Qwen/Qwen3.6-35B-A3B-UD-Q5_K_S.gguf
  extra_args:
    - "--fit"
    - "on"
    - "-fa"
    - "on"
    - "-ctk"
    - "q4_0"
    - "-ctv"
    - "q4_0"
    - "-c"
    - "32768"
    - "-t"
    - "14"
    - "-cnv"

network:
  name: ai-platform
  probe_image: "docker.io/curlimages/curl@sha256:c3b8bee303c6c6beed656cfc921218c529d65aa61114eb9e27c62047a1271b9b"

services:
  - postgres
  - clickhouse
  - redis
  - langfuse
  - litellm
  - caddy
