[project]
name = "ai-platform"
version = "0.1.0"
description = "Self-hosted AI Platform"
requires-python = ">=3.12"
dependencies = [

  "fastapi>=0.110.0",
  "jinja2",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "pyyaml",
  "rich",
  "typer",
  "uvicorn>=0.28.0",
]

[project.scripts]
ai-platform = "ai_platform.cli:app"

[tool.uv]
package = false


[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "ruff>=0.12.10",
  "pytest>=8.4.1",
  "pre-commit>=4.3.0",
  "yamllint>=1.37.1",
  "playwright>=1.62.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "backups", "state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

